all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    jenkins:
      hosts:
        jenkins-vm:
          ansible_connection: local

    monitoring:
      hosts:
        observability-vm:
          # Floating IP. 사설 IP는 172.16.20.182
          ansible_host: 10.20.0.140

    # Kolla-Ansible OpenStack 물리 노드. sudo 비밀번호가 필요하므로 --ask-become-pass로 실행
    # alloy_scrape_jobs: Kolla가 띄운 exporter. Kolla 관리망(10.10.0.x) IP에만 열려 있음
    #   mysqld·rabbitmq = control 그룹, libvirt = compute 그룹, openstack = Kolla [monitoring] 그룹(os-ctl1만)
    openstack_nodes:
      hosts:
        os-ctl1:
          ansible_host: 10.20.0.2
          ansible_user: pika1
          alloy_scrape_jobs:
            - { name: mysqld, address: "10.10.0.11:9104" }
            - { name: rabbitmq, address: "10.10.0.11:15692" }
            - { name: libvirt, address: "10.10.0.11:9177" }
            # 수집할 때마다 OpenStack API를 호출해 느림. Kolla 기본값과 같은 간격·타임아웃
            - { name: openstack, address: "10.10.0.11:9198", interval: 60s, timeout: 45s }
        os-ctl2:
          ansible_host: 10.20.0.3
          ansible_user: pika2
          alloy_scrape_jobs:
            - { name: mysqld, address: "10.10.0.12:9104" }
            - { name: rabbitmq, address: "10.10.0.12:15692" }
            - { name: libvirt, address: "10.10.0.12:9177" }
        os-ctl3:
          ansible_host: 10.20.0.4
          ansible_user: pika3
          alloy_scrape_jobs:
            - { name: mysqld, address: "10.10.0.13:9104" }
            - { name: rabbitmq, address: "10.10.0.13:15692" }
            - { name: libvirt, address: "10.10.0.13:9177" }
        os-cmp1:
          ansible_host: 10.20.0.5
          ansible_user: hong
          alloy_scrape_jobs:
            - { name: libvirt, address: "10.10.0.14:9177" }
