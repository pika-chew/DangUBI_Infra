all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Kolla-Ansible OpenStack 물리 노드. sudo 비밀번호가 필요하므로 --ask-become-pass로 실행
    # alloy_scrape_jobs: Kolla가 띄운 exporter. Kolla 관리망(10.10.0.x) IP에만 열려 있음
    #   mysqld·rabbitmq = control 그룹, libvirt = compute 그룹, openstack = Kolla [monitoring] 그룹(os-ctl1만)
    openstack_nodes:
      hosts:
        os-ctl1:
          ansible_host: 10.20.0.2
          ansible_user: pika1
          alloy_scrape_jobs:
            - { name: mysqld, address: "10.10.0.11:9104" }
            - { name: rabbitmq, address: "10.10.0.11:15692" }
            - { name: libvirt, address: "10.10.0.11:9177" }
            # 수집할 때마다 OpenStack API를 호출해 느림. Kolla 기본값과 같은 간격·타임아웃
            - { name: openstack, address: "10.10.0.11:9198", interval: 60s, timeout: 45s }
        os-ctl2:
          ansible_host: 10.20.0.3
          ansible_user: pika2
          alloy_scrape_jobs:
            - { name: mysqld, address: "10.10.0.12:9104" }
            - { name: rabbitmq, address: "10.10.0.12:15692" }
            - { name: libvirt, address: "10.10.0.12:9177" }
        os-ctl3:
          ansible_host: 10.20.0.4
          ansible_user: pika3
          alloy_scrape_jobs:
            - { name: mysqld, address: "10.10.0.13:9104" }
            - { name: rabbitmq, address: "10.10.0.13:15692" }
            - { name: libvirt, address: "10.10.0.13:9177" }
        os-cmp1:
          ansible_host: 10.20.0.5
          ansible_user: hong
          alloy_scrape_jobs:
            - { name: libvirt, address: "10.10.0.14:9177" }
    jenkins:
      hosts:
        jenkins-vm:
          ansible_connection: local

    monitoring:
      hosts:
        observability-vm:
          # Floating IP. 사설 IP는 172.16.20.20
          ansible_host: 10.20.0.140

    vault:
      hosts:
        vault-vm:
          # Floating IP. 사설 IP는 172.16.20.30
          ansible_host: 10.20.0.170

    kubernetes:
      # SSH는 Horizon의 Floating IP, 클러스터 내부 통신은 사설 IP를 사용합니다.
      # 7대 모두 실제 조회 결과: 사설망 NIC ens3, NIC MTU 1450.
      children:
        kubernetes_control_plane:
          hosts:
            k8s-control-1:
              ansible_host: 10.20.0.111
              kubernetes_node_ip: 172.16.10.11
              kubernetes_physical_host: ctl3
              kubernetes_interface: ens3
              kubernetes_nic_mtu: 1450
            k8s-control-2:
              ansible_host: 10.20.0.112
              kubernetes_node_ip: 172.16.10.12
              kubernetes_physical_host: ctl2
              kubernetes_interface: ens3
              kubernetes_nic_mtu: 1450
            k8s-control-3:
              ansible_host: 10.20.0.113
              kubernetes_node_ip: 172.16.10.13
              kubernetes_physical_host: ctl1
              kubernetes_interface: ens3
              kubernetes_nic_mtu: 1450
        kubernetes_workers:
          hosts:
            k8s-worker-1:
              ansible_host: 10.20.0.121
              kubernetes_node_ip: 172.16.10.21
              kubernetes_physical_host: ctl3
              kubernetes_interface: ens3
              kubernetes_nic_mtu: 1450
            k8s-worker-2:
              ansible_host: 10.20.0.122
              kubernetes_node_ip: 172.16.10.22
              kubernetes_physical_host: ctl2
              kubernetes_interface: ens3
              kubernetes_nic_mtu: 1450
            k8s-worker-3:
              ansible_host: 10.20.0.123
              kubernetes_node_ip: 172.16.10.23
              kubernetes_physical_host: ctl1
              kubernetes_interface: ens3
              kubernetes_nic_mtu: 1450
            k8s-worker-4:
              ansible_host: 10.20.0.124
              kubernetes_node_ip: 172.16.10.24
              kubernetes_physical_host: cmp1
              kubernetes_interface: ens3
              kubernetes_nic_mtu: 1450
