all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    jenkins:
      hosts:
        jenkins-vm:
          ansible_connection: local

    monitoring:
      hosts:
        observability-vm:
          # Floating IP. 사설 IP는 172.16.20.182
          ansible_host: 10.20.0.140

    kubernetes:
      # SSH는 Horizon의 Floating IP, 클러스터 내부 통신은 사설 IP를 사용합니다.
      # NIC 이름과 MTU는 VM에서 확인한 뒤 빈 값을 채웁니다.
      children:
        kubernetes_control_plane:
          hosts:
            k8s-control-1:
              ansible_host: 10.20.0.111
              kubernetes_node_ip: 172.16.10.11
              kubernetes_physical_host: ctl3
              kubernetes_interface: "" # 사설 IP가 할당된 NIC 이름
              kubernetes_nic_mtu: null # 해당 NIC의 실제 MTU 정수
            k8s-control-2:
              ansible_host: 10.20.0.112
              kubernetes_node_ip: 172.16.10.12
              kubernetes_physical_host: ctl2
              kubernetes_interface: "" # 사설 IP가 할당된 NIC 이름
              kubernetes_nic_mtu: null # 해당 NIC의 실제 MTU 정수
            k8s-control-3:
              ansible_host: 10.20.0.113
              kubernetes_node_ip: 172.16.10.13
              kubernetes_physical_host: ctl1
              kubernetes_interface: "" # 사설 IP가 할당된 NIC 이름
              kubernetes_nic_mtu: null # 해당 NIC의 실제 MTU 정수
        kubernetes_workers:
          hosts:
            k8s-worker-1:
              ansible_host: 10.20.0.121
              kubernetes_node_ip: 172.16.10.21
              kubernetes_physical_host: ctl3
              kubernetes_interface: "" # 사설 IP가 할당된 NIC 이름
              kubernetes_nic_mtu: null # 해당 NIC의 실제 MTU 정수
            k8s-worker-2:
              ansible_host: 10.20.0.122
              kubernetes_node_ip: 172.16.10.22
              kubernetes_physical_host: ctl2
              kubernetes_interface: "" # 사설 IP가 할당된 NIC 이름
              kubernetes_nic_mtu: null # 해당 NIC의 실제 MTU 정수
            k8s-worker-3:
              ansible_host: 10.20.0.123
              kubernetes_node_ip: 172.16.10.23
              kubernetes_physical_host: ctl1
              kubernetes_interface: "" # 사설 IP가 할당된 NIC 이름
              kubernetes_nic_mtu: null # 해당 NIC의 실제 MTU 정수
            k8s-worker-4:
              ansible_host: 10.20.0.124
              kubernetes_node_ip: 172.16.10.24
              kubernetes_physical_host: cmp1
              kubernetes_interface: "" # 사설 IP가 할당된 NIC 이름
              kubernetes_nic_mtu: null # 해당 NIC의 실제 MTU 정수
