all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    jenkins:
      hosts:
        jenkins-vm:
          ansible_connection: local

    monitoring:
      hosts:
        observability-vm:
          # Floating IP. 사설 IP는 172.16.20.182
          ansible_host: 10.20.0.140

    kubernetes:
      children:
        kubernetes_control_plane:
          hosts: {}
          # VM 생성 후 hosts: {}를 hosts:로 바꾸고 아래 항목을 활성화합니다.
          #   k8s-cp-1:
          #     ansible_host: <ctl1 위 VM의 SSH 접속 IP>
          #     kubernetes_node_ip: <사설 IP>
          #     kubernetes_physical_host: ctl1
          #     kubernetes_interface: <사설망 NIC>
          #     kubernetes_nic_mtu: <NIC MTU 정수>
          #   k8s-cp-2:
          #     ansible_host: <ctl2 위 VM의 SSH 접속 IP>
          #     kubernetes_node_ip: <사설 IP>
          #     kubernetes_physical_host: ctl2
          #     kubernetes_interface: <사설망 NIC>
          #     kubernetes_nic_mtu: <NIC MTU 정수>
          #   k8s-cp-3:
          #     ansible_host: <ctl3 위 VM의 SSH 접속 IP>
          #     kubernetes_node_ip: <사설 IP>
          #     kubernetes_physical_host: ctl3
          #     kubernetes_interface: <사설망 NIC>
          #     kubernetes_nic_mtu: <NIC MTU 정수>
        kubernetes_workers:
          hosts: {}
          # VM 생성 후 hosts: {}를 hosts:로 바꾸고 아래 항목을 활성화합니다.
          #   k8s-worker-1:
          #     ansible_host: <ctl1 위 VM의 SSH 접속 IP>
          #     kubernetes_node_ip: <사설 IP>
          #     kubernetes_physical_host: ctl1
          #     kubernetes_interface: <사설망 NIC>
          #     kubernetes_nic_mtu: <NIC MTU 정수>
          #   k8s-worker-2:
          #     ansible_host: <ctl2 위 VM의 SSH 접속 IP>
          #     kubernetes_node_ip: <사설 IP>
          #     kubernetes_physical_host: ctl2
          #     kubernetes_interface: <사설망 NIC>
          #     kubernetes_nic_mtu: <NIC MTU 정수>
          #   k8s-worker-3:
          #     ansible_host: <ctl3 위 VM의 SSH 접속 IP>
          #     kubernetes_node_ip: <사설 IP>
          #     kubernetes_physical_host: ctl3
          #     kubernetes_interface: <사설망 NIC>
          #     kubernetes_nic_mtu: <NIC MTU 정수>
          #   k8s-worker-4:
          #     ansible_host: <cmp1 위 VM의 SSH 접속 IP>
          #     kubernetes_node_ip: <사설 IP>
          #     kubernetes_physical_host: cmp1
          #     kubernetes_interface: <사설망 NIC>
          #     kubernetes_nic_mtu: <NIC MTU 정수>
