all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    jenkins:
      hosts:
        jenkins-vm:
          ansible_connection: local

    monitoring:
      hosts:
        observability-vm:
          # Floating IP. 사설 IP는 172.16.20.182
          ansible_host: 10.20.0.140

    # Kolla-Ansible OpenStack 물리 노드. sudo 비밀번호가 필요하므로 --ask-become-pass로 실행
    openstack_nodes:
      hosts:
        os-ctl1:
          ansible_host: 10.20.0.2
          ansible_user: pika1
        os-ctl2:
          ansible_host: 10.20.0.3
          ansible_user: pika2
        os-ctl3:
          ansible_host: 10.20.0.4
          ansible_user: pika3
        os-cmp1:
          ansible_host: 10.20.0.5
          ansible_user: hong
