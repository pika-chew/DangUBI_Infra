---
# VM에서 확인한 값만 반영합니다. 미확정 값은 선택·검증 후 채웁니다.
# 비공개 값은 같은 폴더의 암호화된 vault.yml에서 읽습니다.
ansible_ssh_private_key_file: "{{ vault_ansible_ssh_private_key_file }}"

# Calico 3.33의 테스트 범위와 containerd 공식 호환표를 기준으로 고정합니다.
# 정확한 APT 버전은 공식 저장소에서 존재를 확인했습니다. 실제 VM 설치 검증은 별도입니다.
kubernetes_version: "1.36.5"
kubernetes_package_version: "1.36.5-1.1"
kubernetes_containerd_package_version: "2.3.6-1~ubuntu.24.04~noble" # containerd 2.3 LTS

# Calico role이 Tigera Operator와 Installation 리소스를 설치할 때 사용하는 값입니다.
# Installation에서는 linuxDataplane=Iptables, bgp=Disabled, ipPools[].encapsulation=VXLAN을 명시합니다.
# kube-proxy는 유지하며 VXLAN Always를 사용합니다. VM NIC MTU(1450)는 변경하지 않습니다.
kubernetes_cni: calico
kubernetes_calico_version: "v3.33.0"
kubernetes_calico_dataplane: Iptables
kubernetes_calico_encapsulation: VXLAN
kubernetes_calico_bgp: Disabled
kubernetes_calico_mtu: 1400 # IPv4 VXLAN: 1450 - 50. WireGuard 미사용 기준

# kubeadm과 Calico IPPool에서 같은 Pod CIDR을 사용합니다.
# Service CIDR은 /16으로 선택
kubernetes_node_cidr: "{{ vault_kubernetes_node_cidr }}"
kubernetes_pod_cidr: "{{ vault_kubernetes_pod_cidr }}"
kubernetes_service_cidr: "{{ vault_kubernetes_service_cidr }}"
kubernetes_api_endpoint: "172.16.10.10:16443" # Horizon에서 API VIP 예약 포트 확인
kubernetes_api_cert_sans: ['10.20.0.110'] # Horizon에서 API VIP로의 FIP 연결 확인
# CCM role이 노드 정보를 연동하고 미초기화 taint를 해제합니다.
kubernetes_external_cloud_provider: true
kubernetes_ccm_version: v1.36.0 # Kubernetes와 같은 minor 버전으로 고정
kubernetes_openstack_auth_url: http://10.10.0.10:5000
kubernetes_openstack_region: RegionOne
kubernetes_openstack_project_id: df62a014610a4a36bf5fce2d7c605a24
kubernetes_openstack_internal_network: k8s-net
# 기존 Vault 네 값은 유지합니다. CCM 자격 증명은 실행 노드의 환경변수로만 전달합니다.
kubernetes_openstack_application_credential_id: "{{ lookup('ansible.builtin.env', 'OS_APPLICATION_CREDENTIAL_ID') }}"
kubernetes_openstack_application_credential_secret: "{{ lookup('ansible.builtin.env', 'OS_APPLICATION_CREDENTIAL_SECRET') }}"
kubernetes_addon_timeout: 600 # 이미지 다운로드·초기 조정 대기 시간(초)
kubernetes_network_check_image: docker.io/library/busybox:1.37.0
kubernetes_argocd_version: v3.5.7 # 공식 호환표의 Kubernetes 1.33~1.36 테스트 범위

# 별도 LB VM 없이 CP 3대에 HAProxy와 Keepalived를 함께 설치합니다.
kubernetes_manage_api_lb: true
kubernetes_api_endpoint_ready: false # 별도 LB 준비·도달성 확인 후에만 true
kubernetes_api_vip: "172.16.10.10"
kubernetes_api_vip_prefix: 24 # k8s-subnet의 실제 prefix. 허용 주소 쌍의 /32와는 별개
kubernetes_vrrp_router_id: 51 # API VIP 그룹 번호. CP 3대에 같은 값을 사용합니다.

# role을 나눠도 같은 접속 방식과 토큰 수명을 사용하도록 공통 설정을 한 곳에 둡니다.
kubernetes_cri_socket: unix:///run/containerd/containerd.sock
kubernetes_api_lb_port: 16443
kubernetes_join_token_ttl: 15m

# 각 VM의 hosts 항목에 다음 변수를 추가합니다.
# kubernetes_node_ip: <VM의 사설 IP, ansible_host와 다를 수 있음>
# kubernetes_physical_host: <ctl1 또는 ctl2 또는 ctl3 또는 cmp1>
# kubernetes_interface: ens3
# kubernetes_nic_mtu: 1450
