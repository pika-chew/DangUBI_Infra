---
# 대상 VM이 비어 있으면 원격 play가 통째로 생략되므로, 실행 노드에서 먼저 검사합니다.
- name: Require three control planes and four workers
  ansible.builtin.assert:
    that:
      - groups['kubernetes_control_plane'] | default([]) | length == 3
      - groups['kubernetes_workers'] | default([]) | length == 4
      - groups['kubernetes_control_plane'] | default([]) | intersect(groups['kubernetes_workers'] | default([])) | length == 0
      - groups['kubernetes'] | default([]) | length == 7
      - not ansible_check_mode
    fail_msg: VM 7대의 inventory를 먼저 채우세요. 이 초기 구축 플레이북은 --check를 지원하지 않습니다.
