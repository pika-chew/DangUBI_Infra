---
# Grafana 공식 APT 저장소로 Alloy를 설치하고 systemd 서비스로 실행
- name: Verify required variables are set
  ansible.builtin.assert:
    that:
      - alloy_cluster is defined
      - alloy_remote_write_url is defined
    fail_msg: "alloy_cluster, alloy_remote_write_url을 inventory/group_vars에 지정하세요."

- name: Install Grafana repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gpg
      - python3-debian
    state: present
    update_cache: true

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Grafana repository signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Install Alloy
  ansible.builtin.apt:
    name: "{{ 'alloy=' ~ alloy_version if alloy_version else 'alloy' }}"
    state: present
    update_cache: true
  notify: Restart alloy

- name: Render Alloy service options
  ansible.builtin.template:
    src: alloy.default.j2
    dest: /etc/default/alloy
    mode: '0644'
  notify: Restart alloy

# 비밀번호가 들어갈 수 있으므로 alloy 사용자만 읽도록 제한
# validate: 문법 오류가 있는 설정은 배포하지 않음
- name: Render Alloy config
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: '0640'
    validate: alloy fmt %s
  notify: Restart alloy

- name: Ensure Alloy service is enabled and running
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
