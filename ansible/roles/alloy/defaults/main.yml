---
# 비워두면 APT 저장소 최신 버전 설치. 고정하려면 "1.10.2"처럼 지정
alloy_version: ""

# 모든 텔레메트리에 붙이는 공통 라벨
alloy_env: private
# alloy_cluster는 inventory/group_vars에서 그룹별로 지정

# 메트릭을 보낼 Prometheus remote write 주소 (inventory/group_vars에서 지정)
# alloy_remote_write_url: http://<모니터링 VM>/api/v1/write
# 백엔드에 인증을 붙일 때만 지정 (비밀번호는 Vault)
# alloy_remote_write_username:
# alloy_remote_write_password:

alloy_scrape_interval: 30s

# 추가로 scrape할 외부 exporter 목록. 호스트마다 다르므로 inventory에서 호스트별로 지정
# name은 job 라벨이자 Alloy 컴포넌트 이름이라 영문·숫자·_만 사용
#   - { name: mysqld, address: "10.10.0.11:9104" }
#   - { name: openstack, address: "10.10.0.11:9198", interval: 60s, timeout: 45s }
# 선택 항목: scheme(https), metrics_path(기본 /metrics), params(쿼리 문자열)
#   - { name: vault, address: "127.0.0.1:8210", scheme: https, metrics_path: /v1/sys/metrics, params: { format: [prometheus] } }
alloy_scrape_jobs: []

# 네트워크 메트릭에서 뺄 인터페이스. 컨테이너·VM마다 생기는 가상 인터페이스는 수가 많고 수시로 바뀜
# (docker veth, OpenStack OVS의 tap/qvo/qvb/qbr)
alloy_netdev_device_exclude: "^(veth.*|tap.*|qvo.*|qvb.*|qbr.*)$"

# 로그를 보낼 Loki push 주소. 지정한 그룹만 로그를 수집한다 (inventory/group_vars에서 지정)
# alloy_loki_url: http://<모니터링 VM>:3100/loki/api/v1/push

# 수집할 Kolla 서비스 로그 폴더 (/var/log/kolla/<이름>/*.log). 호스트에 없는 폴더는 무시된다
alloy_kolla_log_services: []

# journald에서 수집할 systemd 서비스(유닛 이름)와 Docker 컨테이너(컨테이너 이름)
# 컨테이너는 compose에서 logging driver를 journald로 지정해야 journal에 쌓인다
alloy_journal_units: []
alloy_journal_containers: []

# 그 밖에 파일로 쌓이는 로그. labels는 Loki 라벨 (고유값을 넣지 말 것)
#   - { path: /var/log/vault/audit.log, labels: { service: vault, component: audit } }
alloy_file_logs: []

# 호스트 메트릭의 instance 라벨. 비워두면 OS 호스트명. VM 이름과 다를 때 group_vars에서 지정
# alloy_instance: "{{ inventory_hostname }}"

# Alloy 디버깅 UI. 외부에 노출하지 않도록 localhost에만 바인딩
alloy_listen_addr: 127.0.0.1:12345
