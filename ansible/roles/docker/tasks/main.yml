---
# Docker 공식 APT 저장소를 사용해 Jenkins 제어 노드에 Docker Engine 설치
- name: Install Docker repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: true

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and build tools
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add Ansible user to the Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Verify Docker Engine is available
  ansible.builtin.command: docker --version
  changed_when: false

# Lambda(arm64) 이미지를 x86 호스트에서 빌드하기 위한 QEMU 에뮬레이션
# 패키지가 systemd-binfmt로 부팅 때마다 등록하므로 재부팅해도 유지된다
# F(fix-binary) 플래그로 등록되어 컨테이너 안에서도 에뮬레이터를 찾을 수 있다
- name: Install arm64 emulation for cross-platform image builds
  ansible.builtin.apt:
    name: qemu-user-static
    state: present
  when: ansible_architecture != 'aarch64'

- name: Read arm64 binfmt registration
  ansible.builtin.slurp:
    src: /proc/sys/fs/binfmt_misc/qemu-aarch64
  register: qemu_aarch64_binfmt
  when: ansible_architecture != 'aarch64'

- name: Verify arm64 emulation is enabled with the fix-binary flag
  ansible.builtin.assert:
    that:
      - "'enabled' in binfmt_text"
      - "binfmt_text | regex_search('^flags: .*F', multiline=True)"
    fail_msg: "qemu-aarch64 binfmt가 F 플래그로 등록되지 않았습니다. 'systemctl restart systemd-binfmt' 후 다시 실행하세요."
  vars:
    binfmt_text: "{{ qemu_aarch64_binfmt.content | b64decode }}"
  when: ansible_architecture != 'aarch64'
