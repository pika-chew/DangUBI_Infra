# HashiCorp Vault 알림. 메트릭은 vault-vm의 Alloy가 메트릭 전용 listener(127.0.0.1:8210)에서 수집한다.
groups:
  - name: vault
    rules:
      # sealed 상태에서는 /v1/sys/metrics가 응답하지 않아 up이 0이 된다.
      # 재시작·재부팅 뒤 unseal을 잊으면 Vault를 쓰는 모든 서비스가 비밀값을 못 읽으므로 critical
      - alert: VaultSealedOrDown
        expr: up{job="vault"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}의 Vault가 sealed 상태이거나 응답하지 않음. vault status 확인 후 unseal 필요"
          log_query: '{cluster="vault-vm", unit="vault.service"}'

      # Vault는 audit 로그를 하나도 쓰지 못하면 모든 요청을 거부한다(감사 기록 없이 비밀값을 내주지 않음).
      # 이때 Vault는 살아 있고 unsealed라 up은 1로 남아 위 알림으로는 잡히지 않는다.
      # 원인은 대개 /var/log/vault 디스크 부족이나 파일 권한 문제다.
      - alert: VaultAuditLogFailure
        expr: increase(vault_audit_log_request_failure[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} Vault audit 로그 기록 실패. 모든 요청이 거부될 수 있음 (/var/log/vault 디스크·권한 확인)"
          log_query: '{cluster="vault-vm", unit="vault.service"}'
