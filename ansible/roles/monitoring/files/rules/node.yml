# 노드 자원 알림. Alloy가 호스트 메트릭을 보내는 모든 머신에 공통으로 적용한다.
#   물리 노드(cluster="openstack"), K8s 노드(cluster="k8s"), 단독 VM(observability-vm, jenkins-vm, vault-vm)
# 노드 메트릭의 job 이름은 K8s 노드가 node, 나머지(Ansible로 설치한 Alloy)는 integrations/unix다.
groups:
  - name: node
    rules:
      # 읽기 전용이나 메모리 기반 파일시스템은 제외한다. (원래 꽉 차 있거나 쓸 일이 없는 경우가 많아 알림이 의미 없이 울린다.)
      - alert: NodeDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs"}
            / node_filesystem_size_bytes * 100 < 15
          and node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}의 {{ $labels.mountpoint }} 남은 공간 {{ $value | printf \"%.1f\" }}%"

      - alert: NodeDiskCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs"}
            / node_filesystem_size_bytes * 100 < 5
          and node_filesystem_readonly == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}의 {{ $labels.mountpoint }} 남은 공간 {{ $value | printf \"%.1f\" }}%"

      # MemAvailable은 캐시처럼 바로 돌려받을 수 있는 메모리까지 포함한 실제 여유분이다.
      - alert: NodeMemoryHigh
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} 사용 가능 메모리 {{ $value | printf \"%.1f\" }}%"

      # 메모리가 바닥나 커널이 프로세스를 강제 종료(OOM kill)했을 때. 머신이 죽는 게 아니라 프로세스 하나가 죽는다.
      # NodeMemoryHigh는 10분 지속 조건이라 순간적으로 메모리가 터지는 경우를 놓치므로 따로 둔다.
      # K8s 노드에서는 Pod가 자기 메모리 limit을 넘어 종료된 경우(OOMKilled)도 여기에 포함된다.
      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels:
          severity: warning
          # 사건형: 5분 뒤 저절로 풀리므로 RESOLVED를 보내지 않는다 (alertmanager slack-event)
          type: event
        annotations:
          summary: "{{ $labels.instance }}에서 메모리 부족으로 프로세스 강제 종료(OOM kill) 발생"

  - name: power
    rules:
      # 노트북은 정전·어댑터 분리 시 배터리로 버티다 조용히 꺼진다.
      # ADP1은 노트북 AC 어댑터. 데스크톱에는 이 장치가 없어 메트릭 자체가 없으므로 울리지 않는다.
      # USB-C 포트(ucsi-source-psy-*)는 포트별 상태라 기본값부터 0인 포트가 있어 보지 않는다.
      - alert: HostOnBattery
        expr: node_power_supply_online{cluster="openstack", power_supply="ADP1"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} 전원 어댑터 분리, 배터리로 동작 중 (정전 또는 케이블 확인)"

  - name: network
    rules:
      # 물리 노드는 무선(wlo1)으로 외부 인터넷에 나가고, 노드끼리·모니터링 VM과는 유선 스위치로 통신한다.
      # 그래서 무선이 끊겨도 메트릭은 계속 들어와 이 알림이 울린다.
      # carrier는 링크 연결 여부만 본다. 연결은 됐는데 인터넷이 안 되는 경우(공유기·DNS 장애)는 잡지 못한다.
      - alert: HostUplinkDown
        expr: node_network_carrier{cluster="openstack", device="wlo1"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} 무선 업링크(wlo1) 끊김"

  - name: collector
    rules:
      # Alloy가 죽거나 전송이 끊기면 up 자체가 오지 않아 TargetDown(up == 0)이 울리지 않는다.
      # 하루 안에 노드 메트릭을 보낸 적이 있는데 지금은 없는 노드를 찾는다.
      # 노드를 일부러 없앤 경우에도 하루 동안 울리고, 하루 넘게 끊기면 사라진다.
      - alert: AlloyMetricsMissing
        expr: |
          group by (cluster, instance) (max_over_time(up{job=~"node|integrations/unix"}[1d]))
          unless
          group by (cluster, instance) (up{job=~"node|integrations/unix"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.instance }}에서 노드 메트릭이 들어오지 않음 (Alloy 중단 또는 전송 실패)"
