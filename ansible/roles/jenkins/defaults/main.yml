---
jenkins_dir: /opt/jenkins
jenkins_home_dir: /data/jenkins_home
# Dockerfile/plugins.txt를 바꾸면 끝 숫자를 올린다 (이미지 재빌드)
jenkins_image: custom-jenkins:lts-jdk21-2
# 웹 포트 바인딩 주소. 루프백에만 열고 외부 접속은 tailscale serve로 프록시 (0.0.0.0이면 모든 NIC에 노출)
jenkins_bind_address: 127.0.0.1
# 컨테이너 네트워크 MTU. VM NIC(ens3) MTU보다 크면 큰 패킷이 버려져 HTTPS 핸드셰이크가 멈춘다
jenkins_docker_mtu: 1450
# 업데이트 센터 등 외부 HTTP 호출이 무한 대기하지 않도록 하는 타임아웃 (ms)
jenkins_http_connect_timeout: 10000
jenkins_http_read_timeout: 60000
